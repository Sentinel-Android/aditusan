name: Deploy Aditusan to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the website
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Generate sitemap from website pages
        run: node scripts/generate-sitemap.mjs
      - name: Validate JavaScript and local assets
        run: |
          node --check scripts/generate-sitemap.mjs
          node scripts/test-sitemap.mjs
          node --check dist/main.js
          node --check dist/projects.js
          node --check dist/appearance.js
          node --check dist/seasonal-tree.js
          node scripts/verify.mjs
          node scripts/test-appearance.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v4
